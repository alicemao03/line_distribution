<!Doctype html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>svt line distribution</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/single_song.css">
	<link rel="stylesheet" href="../css/nav.css">
	<script src="https://code.jquery.com/jquery-1.10.2.js"></script>
</head>

<body>
	<div id="nav-placeholder"></div>

	<div class="single-song-heading container-fluid mb-2">
		<div class="single-song-heading-container d-flex">
			<div class="song-img-section">
				<div class="song-img-wrapper">
					<div id="song-img"></div>
				</div>
			</div>
			<div id="song-meta-section">
				<div>
					<div class="row song-meta" id="song-name"></div>
					<div class="row song-meta" id="artist-name"></div>
				</div>
				<div>
					<div class="row song-meta" id="album-info"></div>
				</div>
			</div>
		</div>
	</div>

	<div class="main-body container mb-5">
		<div class="d-flex justify-content-center" id="single-song-body">
			<div class="col chart-body">
				<div class="sticky-wrapper">
					<div class="viz-format-selection d-flex justify-content-start align-items-center mb-3">
						<label for="chart-select" class="me-2">Choose a Chart View</label>
						<select id="chart-select" class="form-select w-25">
							<option value="bar">Bar</option>
							<option value="pie">Pie</option>
							<option value="chord">Chord</option>
						</select>
					</div>

					<div id="chart-area"></div>
				</div>
			</div>

			<div class="col song-body">
				<div id="song-area"></div>
			</div>
		</div>
	</div>
	<div class="single-song-footer">
		<div class="single-song-footer-container">
			<div class="footer-section" id="media-section"></div>
			<hr>
			<div class="footer-section" id="album-section">
				<div class="album-section-container">
					<div class="song-img-wrapper-footer">
						<div id="song-img-footer"></div>
					</div>
				</div>
				<div class="album-section-container">
					<div id="album-title"></div>
					<div id="album-tracklist"></div>
				</div>
			</div>
			<hr>
			<div class="footer-section" id="credit-section"></div>
		</div>
	</div>
	<div id="tooltip"></div>


	<script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>

	<script>
		$(function () {
			$("#nav-placeholder").load("navbar.html", function () {
				const store = JSON.parse(localStorage.getItem('data'))

				const song = store['song']
				console.log("nav", song['song_art_text_color'])
				$(".navbar").css("color", song['song_art_text_color'])
					.css("background-color", song["song_art_primary_color"])
				$(".navbar a").css("color", song['song_art_text_color'])
					.css("background-color", song["song_art_primary_color"])
			})
		});
	</script>

	<script type="module" src="../js/singleSong.js"></script>
</body>

</html>
